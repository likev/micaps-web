<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MICAPS-Web Meteorological Workstation</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/tabs.css" />
  <link rel="stylesheet" href="./node_modules/maplibre-gl/dist/maplibre-gl.css" />
  <script>
    window.__LOGS__ = [];
    window.addEventListener('error', e => window.__LOGS__.push('ERR: ' + e.message + ' at ' + e.filename + ':' + e.lineno));
    window.addEventListener('unhandledrejection', e => window.__LOGS__.push('REJECT: ' + (e.reason ? (e.reason.stack || e.reason) : e)));
    const _origLog = console.log, _origErr = console.error;
    console.log = (...args) => { window.__LOGS__.push('LOG: ' + args.join(' ')); _origLog(...args); };
    console.error = (...args) => { window.__LOGS__.push('CERR: ' + args.join(' ')); _origErr(...args); };
  </script>
</head>
<body>
  <div id="app">
    <header id="navbar"></header>
    <div id="tabs-bar"></div>
    <main id="main-content">
      <div id="workspace-container"></div>
      <button id="btn-fullscreen-toggle" class="btn-fullscreen-toggle" type="button" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </button>
      <aside id="catalog-drawer" class="drawer hidden"></aside>
      <div id="layer-control" class="panel"></div>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="legend-panel" class="legend-panel"></div>
    </main>
    <footer id="timeslider-container" class="hidden"></footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
